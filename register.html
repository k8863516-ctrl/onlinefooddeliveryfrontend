<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - FoodSwift</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <!-- Connectivity Banner -->
  <div id="api-status-banner" class="api-banner"></div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand">
        <span class="brand-icon">🍔</span> Food<span>Swift</span>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="restaurants.html" class="nav-link">Restaurants</a>
      </nav>
      <div class="nav-actions">
        <a href="login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <!-- Register Form -->
  <main class="auth-wrapper">
    <div class="auth-card" style="max-width: 540px;">
      <div class="auth-header">
        <div class="auth-logo">📝</div>
        <h1 class="auth-title">Create Your Account</h1>
        <p class="auth-subtitle">Join FoodSwift for instant dining orders & partner benefits</p>
      </div>

      <div class="auth-body">
        <form id="register-form">
          <div class="form-group">
            <label class="form-label" for="name">Full Name *</label>
            <input type="text" id="name" class="form-control" placeholder="Alex Johnson" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email Address *</label>
            <input type="email" id="email" class="form-control" placeholder="alex@example.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password (min 6 characters) *</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="6">
          </div>

          <div class="form-group">
            <label class="form-label" for="phone">Phone Number</label>
            <input type="tel" id="phone" class="form-control" placeholder="+1 (555) 019-2834">
          </div>

          <div class="form-group">
            <label class="form-label" for="address">Delivery Address</label>
            <input type="text" id="address" class="form-control" placeholder="42 Wallaby Way, Suite 10">
          </div>

          <div class="form-group">
            <label class="form-label" for="role">Register As</label>
            <select id="role" class="form-control">
              <option value="ROLE_CUSTOMER">Customer (Order food & track delivery)</option>
              <option value="ROLE_RESTAURANT">Restaurant Partner (Manage menu & orders)</option>
              <option value="ROLE_ADMIN">Platform Admin (Manage full platform)</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.25rem;">
            Create Account
          </button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="login.html">Sign In</a>
        </div>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
