<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - FoodSwift Delivery</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cart.css">
</head>
<body>

  <!-- Connectivity Banner -->
  <div id="api-status-banner" class="api-banner"></div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand">
        <span class="brand-icon">🍔</span> Food<span>Swift</span>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="restaurants.html" class="nav-link">Restaurants</a>
        <a href="my-orders.html" class="nav-link">My Orders</a>
      </nav>
      <div class="nav-actions">
        <!-- Rendered by app.js -->
        <a href="cart.html" class="cart-btn">🛒 Cart <span class="cart-badge">0</span></a>
      </div>
    </div>
  </header>

  <!-- Cart Page Body -->
  <main class="container">
    <div class="cart-layout">
      <!-- Items Panel -->
      <section id="cart-items-container" class="cart-items-panel">
        <div style="text-align: center; padding: 2rem;">
          <p style="color: var(--text-secondary);">Loading your cart items...</p>
        </div>
      </section>

      <!-- Order Summary Card -->
      <aside id="cart-summary-box" class="summary-card" style="display: none;">
        <h3 class="summary-title">Order Summary</h3>

        <div class="summary-row">
          <span>Items Subtotal</span>
          <strong id="summary-subtotal">$0.00</strong>
        </div>

        <div class="summary-row">
          <span>Delivery Fee</span>
          <strong id="summary-delivery">$2.99</strong>
        </div>

        <div class="summary-row">
          <span>Estimated Taxes (8%)</span>
          <strong id="summary-tax">$0.00</strong>
        </div>

        <div class="summary-row total-row">
          <span>Total Amount</span>
          <span id="summary-total" class="total-amount">$0.00</span>
        </div>

        <button onclick="proceedToCheckout()" class="btn btn-primary btn-block" style="margin-top: 1.5rem; font-size: 1.05rem;">
          Proceed to Checkout →
        </button>

        <div style="text-align: center; margin-top: 1rem; font-size: 0.85rem; color: var(--text-secondary);">
          🔒 Safe & Encrypted Checkout
        </div>
      </aside>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container footer-bottom">
      &copy; 2026 FoodSwift Delivery. Online Food Delivery System.
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
