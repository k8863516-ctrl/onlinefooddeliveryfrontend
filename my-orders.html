<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - FoodSwift Delivery</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- Connectivity Banner -->
  <div id="api-status-banner" class="api-banner"></div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand">
        <span class="brand-icon">🍔</span> Food<span>Swift</span>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="restaurants.html" class="nav-link">Restaurants</a>
        <a href="my-orders.html" class="nav-link active">My Orders</a>
      </nav>
      <div class="nav-actions">
        <a href="cart.html" class="cart-btn">🛒 Cart <span class="cart-badge">0</span></a>
      </div>
    </div>
  </header>

  <!-- Orders Header -->
  <section style="background: white; border-bottom: 1px solid var(--border); padding: 2.5rem 0 1.5rem;">
    <div class="container">
      <h1 style="font-size: 2.2rem; font-weight: 800; color: var(--secondary);">My Orders & Tracking</h1>
      <p style="color: var(--text-secondary); margin-top: 0.25rem;">Monitor real-time kitchen progress and past delivery receipts</p>
    </div>
  </section>

  <!-- Orders List Main -->
  <main class="container" style="padding-top: 2.5rem; padding-bottom: 4rem; max-width: 900px;">
    <div id="orders-list">
      <!-- Populated dynamically by orders.js -->
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container footer-bottom">
      &copy; 2026 FoodSwift Delivery. Online Food Delivery System.
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
